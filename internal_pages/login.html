<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mega Store | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
      <link rel="stylesheet" href="../style.css">


</head>
<body>

   <!-- ================= NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark sticky-top">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="#">MEGA STORE</a>

      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link " href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../internal_pages/about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="../internal_pages/contactUs.html">Contact</a></li>
          <li  class="nav-item"><a class="nav-link active" href="../internal_pages/login.html">Login</a></li>
          <!-- <li class="nav-item"><a class="nav-link" href="../internal_pages/profile.html">Profile</a></li> -->



        </ul>

        <form class="d-flex">
          <input class="form-control me-2" placeholder="Search product">
          <button class="btn btn-light">Search</button>
        </form>

     
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-lg p-4 login-card">
      <h2 class="text-center fw-bold mb-4">Login</h2>

      <div class="mb-3">
        <label for="userName" class="form-label">Username</label>
        <input type="text" id="userName" class="form-control" placeholder="Enter username">
      </div>

      <div class="mb-3 position-relative">
        <label for="pass" class="form-label">Password</label>
        <input type="password" id="pass" class="form-control" placeholder="Enter password">
        <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer;" onclick="togglePassword()">👁</span>
      </div>

      <div id="messages" class="text-danger mb-2"></div>
      <button class="btn btn-primary w-100" onclick="loginNow()">Login</button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer text-center py-3">
    © 2025 Mega Store – User Friendly Website
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="login.js"></script>
  <script src="../script.js"></script>

</body>
</html>
