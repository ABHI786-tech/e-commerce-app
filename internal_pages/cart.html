<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mega Store | Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* Page specific cart styling */
    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      border-radius: 12px;
      background: #f1f3f8;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      margin-bottom: 15px;
    }

    .cart-item img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .remove-btn {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .remove-btn:hover {
      background: #084298;
    }
  </style>
</head>

<body class="page-layout">

     <!-- ================= NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark sticky-top">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="#">MEGA STORE</a>

      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../internal_pages/about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="../internal_pages/contactUs.html">Contact</a></li>
          <li id="profile" class="nav-item"><a class="nav-link" href="../internal_pages/profile.html">Profile</a></li>
          <li id="login" class="nav-item"><a class="nav-link" href="../internal_pages/login.html">Login</a></li>



        </ul>

        <form class="d-flex">
          <input class="form-control me-2" placeholder="Search product">
          <button class="btn btn-light">Search</button>
        </form>

       <a class="nav-link" href="./internal_pages/cart.html">
        <button class="btn btn-outline-light ms-3"   id="cart">
            0
        </button>
         </a>
      </div>
    </div>
  </nav>

  <!-- ================= CART CONTENT ================= -->
  <main class="content">
    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">My Cart</h2>
        <button class="btn btn-danger" onclick="clearAllCart()">
          Clear All
        </button>
      </div>

      <div id="cartItem">
        <p class="text-muted">cart items...</p>
      </div>

      <!-- human small note -->
      <p class="text-muted mt-4" style="font-size:14px;">
        * Cart data is stored in browser localStorage.
      </p>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    © 2025 Mega Store – User Friendly Website
  </footer>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Common Script -->
  <script src="../script.js"></script>

  <!-- Cart Script -->
  <script src="cart.js"></script>

</body>
</html>
